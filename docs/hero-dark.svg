<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1622"/>
      <stop offset="1" stop-color="#1C2A47"/>
    </linearGradient>
    <linearGradient id="appblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BA6FA"/>
      <stop offset="1" stop-color="#2154C7"/>
    </linearGradient>
    <filter id="winshadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0A1428" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="620" rx="24" fill="url(#backdrop)"/>

  <!-- ⌘ Space hint -->
  <g>
    <rect x="547" y="52" width="106" height="36" rx="18" fill="#FFFFFF14" stroke="#FFFFFF1F"/>
    <text x="600" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#AEB6C4">⌘ Space</text>
  </g>

  <!-- Spotlight window -->
  <g filter="url(#winshadow)">
    <rect x="240" y="120" width="720" height="424" rx="26" fill="#1D2330F5" stroke="#FFFFFF1F"/>
  </g>

  <!-- search field -->
  <g stroke="#97A0AF" stroke-width="2.6" fill="none" stroke-linecap="round">
    <circle cx="282" cy="158" r="10.5"/>
    <line x1="290" y1="166" x2="298" y2="174"/>
  </g>
  <text x="318" y="166" font-size="21" fill="#F2F4F8">oauth refresh</text>
  <rect x="452" y="146" width="2" height="26" fill="#2E6FF2">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <line x1="262" y1="186" x2="938" y2="186" stroke="#FFFFFF14" stroke-width="1"/>

  <!-- section: agent sessions -->
  <text x="272" y="214" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#8E97A6">AGENT SESSIONS</text>

  <!-- row 1 (selected, Claude) -->
  <rect x="252" y="226" width="696" height="58" rx="14" fill="#2E6FF2"/>
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="288" cy="255" r="13"/>
    <g stroke-linecap="round">
      <line x1="288" y1="248.5" x2="288" y2="261.5"/>
      <line x1="282.4" y1="251.75" x2="293.6" y2="258.25"/>
      <line x1="282.4" y1="258.25" x2="293.6" y2="251.75"/>
    </g>
  </g>
  <text x="316" y="251" font-size="16.5" font-weight="600" fill="#FFFFFF">Fix OAuth token refresh race</text>
  <text x="316" y="272" font-size="13" fill="#D8E4FF">Claude Code · api-server · feat/token-rotation</text>
  <text x="928" y="261" text-anchor="end" font-size="15" fill="#CFE0FF">⏎</text>

  <!-- row 2 (Codex) -->
  <g stroke="#C6CDD9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="279,308 272,315 279,322"/>
    <polyline points="297,308 304,315 297,322"/>
    <line x1="291" y1="306" x2="285" y2="324"/>
  </g>
  <text x="316" y="313" font-size="16.5" fill="#F2F4F8">Add pagination to session list</text>
  <text x="316" y="334" font-size="13" fill="#9AA3B2">Codex · webapp</text>

  <!-- row 3 (Claude) -->
  <g stroke="#C6CDD9" stroke-width="2" fill="none">
    <circle cx="288" cy="375" r="13"/>
    <g stroke-linecap="round">
      <line x1="288" y1="368.5" x2="288" y2="381.5"/>
      <line x1="282.4" y1="371.75" x2="293.6" y2="378.25"/>
      <line x1="282.4" y1="378.25" x2="293.6" y2="371.75"/>
    </g>
  </g>
  <text x="316" y="373" font-size="16.5" fill="#F2F4F8">Migrate scanners to Swift 6 concurrency</text>
  <text x="316" y="394" font-size="13" fill="#9AA3B2">Claude Code · spotion</text>

  <!-- section: actions -->
  <line x1="262" y1="416" x2="938" y2="416" stroke="#FFFFFF14" stroke-width="1"/>
  <text x="272" y="442" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#8E97A6">ACTIONS</text>

  <!-- row 4 (Quick Create) -->
  <g>
    <rect x="272" y="456" width="32" height="32" rx="8.5" fill="url(#appblue)"/>
    <circle cx="288" cy="472" r="8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  </g>
  <text x="316" y="477" font-size="16.5" fill="#F2F4F8">New Claude Session</text>
  <text x="928" y="477" text-anchor="end" font-size="13" fill="#9AA3B2">type a prompt, hit ⏎</text>
</svg>
