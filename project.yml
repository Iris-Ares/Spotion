name: Spotion
options:
  bundleIdPrefix: com.ares
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Exact pin: Package.resolved lives inside the gitignored xcodeproj, so
    # this is the only reproducibility mechanism. Keep in sync with the
    # Sparkle tools version pinned in .github/workflows/release.yml.
    exactVersion: 2.9.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    DEAD_CODE_STRIPPING: "YES"
    # Dev fallback; release builds override both from the git tag
    # (see .github/workflows/release.yml).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0.1.0"
targets:
  Spotion:
    type: application
    platform: macOS
    sources: [Spotion]
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ares.spotion
        INFOPLIST_FILE: Spotion/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Hostless tests: compile the AppKit-free core sources directly, avoiding
  # LSUIElement test-host issues
  SpotionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpotionTests
      - Spotion/Models
      - Spotion/Scanning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ares.SpotionTests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Spotion:
    build:
      targets:
        Spotion: all
    run:
      config: Debug
    test:
      targets: [SpotionTests]
