name: Release

# Pushing a tag vX.Y.Z is the entire release action: it builds the app with
# that version, packages a ZIP, EdDSA-signs the update feed, and publishes a
# GitHub Release. See docs/RELEASING.md for the full procedure and rollback.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep all three in sync when bumping Sparkle:
  # this URL/SHA256 pair and the `exactVersion` pin in project.yml.
  SPARKLE_VERSION: "2.9.5"
  SPARKLE_SHA256: "015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Derive and validate version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: xcodebuild -project Spotion.xcodeproj -scheme Spotion -derivedDataPath build test

      - name: Build Release (version stamped from tag)
        run: |
          xcodebuild -project Spotion.xcodeproj -scheme Spotion \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            build

      # ── Developer ID + notarization insertion point ──────────────────────
      # Builds are currently ad-hoc signed (no Apple Developer membership).
      # Once one exists, follow docs/RELEASING.md §"Adding Developer ID
      # signing + notarization":
      #   1. import the Developer ID Application cert into a temp keychain
      #      (secrets: DEVID_CERT_P12_BASE64, DEVID_CERT_PASSWORD)
      #   2. flip project.yml to hardened runtime + entitlements and build
      #      with CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=…
      #   3. xcrun notarytool submit --wait
      #      (secrets: NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD)
      #   4. xcrun stapler staple Spotion.app   ← staple BEFORE zipping
      # ─────────────────────────────────────────────────────────────────────

      - name: Package ZIP
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/Spotion.app" \
            "dist/Spotion-$VERSION.zip"

      - name: Download Sparkle tools (pinned)
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-dist
          tar -xf sparkle.tar.xz -C sparkle-dist

      - name: Generate EdDSA-signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Single-entry appcast: dist/ holds exactly this release's ZIP, and
          # the enclosure URL points at the *versioned* download path, so old
          # releases' appcasts stay valid forever while SUFeedURL rides the
          # releases/latest/ redirect.
          echo -n "$SPARKLE_PRIVATE_KEY" | ./sparkle-dist/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/Iris-Ares/Spotion/releases/download/v$VERSION/" \
            --full-release-notes-url "https://github.com/Iris-Ares/Spotion/releases/tag/v$VERSION" \
            --link "https://github.com/Iris-Ares/Spotion" \
            --maximum-deltas 0 \
            -o dist/appcast.xml \
            dist
          cat dist/appcast.xml

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 "Spotion-$VERSION.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft → publish so the release only becomes `latest` (and the
          # appcast feed URL only points here) once every asset is uploaded.
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "Spotion $VERSION" \
            --generate-notes \
            "dist/Spotion-$VERSION.zip" "dist/appcast.xml" "dist/SHA256SUMS.txt"
          gh release edit "$GITHUB_REF_NAME" --draft=false

      # Serves `brew install --cask Iris-Ares/tap/spotion`. Runs last, after the
      # release is public, so the download URL the cask points at already
      # resolves. Failing here leaves a published release with a stale cask —
      # loud on purpose, and safe to fix by re-running the job.
      # Needs the TAP_PUSH_TOKEN secret; see docs/RELEASING.md §"Homebrew tap".
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::TAP_PUSH_TOKEN is not set — release published, Homebrew cask NOT bumped."
            exit 1
          fi

          # Reuse the published checksum rather than recomputing, so the cask and
          # SHA256SUMS.txt can never disagree.
          SHA256=$(awk -v f="Spotion-$VERSION.zip" '$2 == f { print $1 }' dist/SHA256SUMS.txt)
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::No usable SHA-256 for Spotion-$VERSION.zip in dist/SHA256SUMS.txt"
            exit 1
          fi

          git clone --depth 1 https://github.com/Iris-Ares/homebrew-tap.git tap
          cd tap
          sed -i '' -E \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" \
            Casks/spotion.rb

          # A no-op sed (cask reformatted upstream) would silently ship the old
          # version, so assert both lines landed instead of trusting the rewrite.
          grep -qx "  version \"$VERSION\"" Casks/spotion.rb || { echo "::error::cask version rewrite failed"; exit 1; }
          grep -qx "  sha256 \"$SHA256\"" Casks/spotion.rb || { echo "::error::cask sha256 rewrite failed"; exit 1; }

          if git diff --quiet; then
            echo "Cask already at $VERSION — nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "spotion $VERSION"
          # Token appears only in this URL; Actions masks secrets in logs.
          git push "https://x-access-token:$TAP_TOKEN@github.com/Iris-Ares/homebrew-tap.git" HEAD:main
